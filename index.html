<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#120622">
    <title>Community Hub</title>
    <meta name="description" content="Welcome to our official community page.">

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Community Hub">
    <meta property="og:description" content="Welcome to our official community page.">
    <meta property="og:image" content="assets/avatar.jpg">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="assets/avatar.jpg">
</head>

<body>

    <div class="page-wrapper">
        <!-- Ambient glow in background -->
        <div class="ambient-glow"></div>

        <!-- Main Mobile Viewport Container -->
        <main class="mobile-container">

            <!-- Top Navigation Bar (Matching Reference Screenshot) -->
            <header class="top-nav">
                <button class="nav-btn" aria-label="Community Badge" title="Community Hub">
                    <!-- Flower/Star badge matching reference -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke-linecap="round"
                            stroke-linejoin="round" style="display:none;" />
                        <!-- 8-pointed star icon -->
                        <path d="M12 2l2.4 6.6L21 9.5l-5.2 4.4 1.8 6.9-5.6-3.8-5.6 3.8 1.8-6.9L3 9.5l6.6-.9L12 2z"
                            fill="currentColor" stroke="none" />
                    </svg>
                </button>

                <button class="nav-btn" id="shareBtn" aria-label="Share Community" title="Share link">
                    <!-- Share icon (box with up arrow) -->
                    <svg viewBox="0 0 24 24" stroke="currentColor">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <polyline points="16 6 12 2 8 6" stroke-linecap="round" stroke-linejoin="round" />
                        <line x1="12" y1="2" x2="12" y2="15" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </header>

            <!-- Profile Header Section -->
            <section class="profile-header">
                <div class="avatar-container">
                    <img src="assets/avatar.jpg" alt="Community Name" class="avatar-img">
                    <div class="verified-badge" title="Verified Community">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                        </svg>
                    </div>
                </div>

                <h1 class="profile-name">Community Name</h1>
                <p class="profile-bio">Welcome to our official community hub!</p>

                <!-- Social Media Row (Matching TikTok/Social row in reference) -->
                <div class="social-links">
                    <!-- TikTok -->
                    <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="social-icon-btn"
                        aria-label="TikTok" title="TikTok">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68a6.34 6.34 0 0 0 10.86 4.43c1.94-1.94 2.1-4.96 2.1-5.46V8.6a8.28 8.28 0 0 0 4.63 1.54V6.75a4.87 4.87 0 0 1-1-.06z" />
                        </svg>
                    </a>
                    <!-- Discord -->
                    <a href="https://discord.gg/DunDZHezd" target="_blank" rel="noopener noreferrer"
                        class="social-icon-btn" aria-label="Discord" title="Discord">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" />
                        </svg>
                    </a>
                    <!-- YouTube -->
                    <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="social-icon-btn"
                        aria-label="YouTube" title="YouTube">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                        </svg>
                    </a>
                </div>
            </section>

            <!-- The 4 Buttons Stack -->
            <section class="buttons-stack" aria-label="Community Links">
                <!-- Active Group Button (Button 1: Direct link to Discord/Group) -->
                <a href="https://discord.gg/DunDZHezd" target="_blank" rel="noopener noreferrer"
                    class="link-card active-card" id="community-btn-1">
                    <div class="card-leading discord-accent">
                        <!-- Discord Icon -->
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" />
                        </svg>
                    </div>

                    <div class="card-content">
                        <span class="card-title">Join Discord Server</span>
                        <span class="card-subtitle">Connect with our main community</span>
                    </div>

                    <!-- Three Dots Context Button (Matching reference) -->
                    <button class="card-trailing" aria-label="Link options" title="More options">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="5" r="2" />
                            <circle cx="12" cy="12" r="2" />
                            <circle cx="12" cy="19" r="2" />
                        </svg>
                    </button>
                </a>

                <!-- TikTok Button -->
                <a href="https://www.tiktok.com/@rb.kika" target="_blank" rel="noopener noreferrer"
                    class="link-card active-card" id="community-btn-2">
                    <div class="card-leading tiktok-accent">
                        <!-- TikTok Icon -->
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 15.68a6.34 6.34 0 0 0 10.86 4.43c1.94-1.94 2.1-4.96 2.1-5.46V8.6a8.28 8.28 0 0 0 4.63 1.54V6.75a4.87 4.87 0 0 1-1-.06z" />
                        </svg>
                    </div>

                    <div class="card-content">
                        <span class="card-title">Follow on TikTok</span>
                        <span class="card-subtitle">@rb.kika</span>
                    </div>

                    <button class="card-trailing" aria-label="Link options" title="More options">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="5" r="2" />
                            <circle cx="12" cy="12" r="2" />
                            <circle cx="12" cy="19" r="2" />
                        </svg>
                    </button>
                </a>

                <!-- Roblox Button -->
                <a href="https://www.roblox.com/users/8278870429/profile?friendshipSourceType=PlayerSearch"
                    target="_blank" rel="noopener noreferrer" class="link-card active-card" id="community-btn-3">
                    <div class="card-leading roblox-accent">
                        <!-- Roblox Icon -->
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M4.016 0L0 19.234 20.18 24 24 4.359 4.016 0zM10.506 14.82l-3.16-.81.826-3.292 3.16.81-.826 3.292z" />
                        </svg>
                    </div>

                    <div class="card-content">
                        <span class="card-title">Roblox Profile</span>
                        <span class="card-subtitle">View profile on Roblox</span>
                    </div>

                    <button class="card-trailing" aria-label="Link options" title="More options">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="5" r="2" />
                            <circle cx="12" cy="12" r="2" />
                            <circle cx="12" cy="19" r="2" />
                        </svg>
                    </button>
                </a>
            </section>

            <!-- Copyright Footer -->
            <div class="copyright-footer">
                <span>&copy; Kikarawr's Property</span>
            </div>

        </main>
    </div>

    <!-- Share / Context Sheet Modal -->
    <div class="modal-backdrop" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Share</h2>
                <button class="modal-close-btn" id="closeModalBtn" aria-label="Close modal">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <div class="modal-actions">
                <button class="modal-action-btn" id="copyLinkBtn">
                    <svg viewBox="0 0 24 24">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg>
                    <span>Copy link to clipboard</span>
                </button>

                <button class="modal-action-btn" id="openNewTabBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                        <polyline points="15 3 21 3 21 9" />
                        <line x1="10" y1="14" x2="21" y2="3" />
                    </svg>
                    <span>Open link in new tab</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- Client Script -->
    <script src="js/app.js"></script>
</body>

</html>
